l_english:
 # ---- Origin ----
 origin_nw_uprooted: "Uprooted"
 origin_nw_uprooted_desc: "The Grove did not die with its world. When the Blight came, the Heartwood hollowed its own trunk, drew the whole biosphere inside, and pulled its roots out of the crust. What drifted free of the wreckage was a tree the size of a moon, alive and awake and homeless.\n\nWe are that tree. We do not build Arkships; we drop seeds and nurture them. We do not claim systems; we leave Rootholds behind and keep drifting. And if the Heartwood withers, a sapling from another Ark can bring it back."
 origin_nw_uprooted_effects: "§HStarts as a Nomadic Empire§! with a single §YTree Ark§! and no homeworld.\n§YArks are grown from seeds§! with Biomass and Food instead of built with Alloys.\nEach Ark carries a §YHeartwood Core§!, a Tree of Life that withers if the Ark is badly damaged.\n§YRootholds§! (Waystations) cost Biomass.\nRequires §YHive Mind§! authority. Incompatible with §YDevouring Swarm§! and §YTerravore§!."

 # ---- Terms ----
 nw_term_ark: "Ark"
 nw_term_sap: "Sap"
 nw_term_roothold: "Roothold"
 nw_term_lattice: "Mycorrhizal Lattice"
 nw_term_seedwing: "Seedwing"
 nw_term_symbiosis: "Symbiosis"

 # ---- Arks ----
 arkship_nw_seed: "Seed"
 arkship_nw_seed_desc: "A closed seed case the size of a sapling's trunk, veins pulsing, a single root probing the dark. What it becomes is up to the tree that dropped it."
 arkship_nw_heartwood_1: "Heartwood Ark (Sapling)"
 arkship_nw_heartwood_2: "Heartwood Ark (Bole)"
 arkship_nw_heartwood_3: "Heartwood Ark (Elder)"
 arkship_nw_heartwood_desc: "The mother tree. A sprawling banyan whose aerial roots form a cage ahead of the trunk, big enough to hold a fleet. Its fruit are cities."
 arkship_nw_lumen_1: "Lumen Ark (Sapling)"
 arkship_nw_lumen_2: "Lumen Ark (Bole)"
 arkship_nw_lumen_3: "Lumen Ark (Elder)"
 arkship_nw_lumen_desc: "The seeker. A pale, slender tree whose flowers face forward like dishes and whose branches glow. At night-side angles it is mostly light."
 arkship_nw_thornwood_1: "Thornwood Ark (Sapling)"
 arkship_nw_thornwood_2: "Thornwood Ark (Bole)"
 arkship_nw_thornwood_3: "Thornwood Ark (Elder)"
 arkship_nw_thornwood_desc: "The warden. A squat, plated trunk, a crown that is more thorn than leaf, and roots clenched into talons. It exists so the other trees do not wither."

 nw_tier_1: "Sapling"
 nw_tier_2: "Bole"
 nw_tier_3: "Elder"

 # ---- Modifiers and deposits ----
 d_nw_heartwood_core: "Heartwood Core"
 d_nw_heartwood_core_desc: "The living heart of this Ark: a Tree of Life grown inward. The hive prospers while it beats."
 nw_withered_heartwood: "Withered Heartwood"
 nw_withered_heartwood_desc: "The core has gone dark. Leaves fall, veins dim, pods go cold. A sapling from an intact Ark in the same system can restore it."
 nw_fruiting: "Fruiting"
 nw_fruiting_desc: "A share of everything this Ark harvests is laid down as biomass."
 nw_living_hull: "Living Hull"
 nw_living_hull_desc: "Bark heals. The Heartwood withers only at far lower hull."
 nw_spore_survey: "Spore Survey"
 nw_spore_survey_desc: "The crown sheds spores that taste the system; this Ark can survey without a science ship."
 nw_heartwood_trait: "$nw_fruiting$"
 nw_lumen_trait: "$nw_spore_survey$"
 nw_thornwood_trait: "$nw_living_hull$"
 nw_nurture_forced_bloom: "Forced Bloom"
 nw_nurture_dormancy: "Deep Dormancy"
 nw_memory_of_the_grove: "Memory of the Grove"
 nw_memory_of_the_grove_desc: "We left the sapling in the Rootscar. We remember where we came from."
 d_nw_husk_of_the_grove: "Husk of the Old Grove"
 d_nw_husk_of_the_grove_desc: "What is left of a world that was one organism. Still faintly alive."
 d_nw_dormant_sapling: "Dormant Sapling"
 d_nw_dormant_sapling_desc: "A single seed of the Heartwood, left in the wreckage against the day every Ark withers."

 # ---- Decisions ----
 decision_nw_transplant_sapling: "Transplant Sapling"
 decision_nw_transplant_sapling_desc: "An intact Ark in this system grows a sapling and passes it across. In half a year the withered core beats again."
 nw_requires_intact_ark_in_system: "Requires another Ark with an intact Heartwood Core in this system."
 decision_nw_take_root: "Take Root"
 decision_nw_take_root_desc: "The Elder lands. Roots go into rock, the trunk becomes a mountain, the crown a sky. The drifting ends and the empire settles as a Wilderness world with a Tree of Life at its heart."
 nw_take_root_last_ark_only: "Only the empire's last Ark may Take Root."
 nw_take_root_needs_target: "Requires an unowned barren world in this system."

 # ---- Situation ----
 situation_nw_nurture_ark: "Nurture the Ark"
 situation_nw_nurture_ark_desc: "Biomass flows into the trunk. Rings thicken. The next stage of life approaches."
 nw_nurture_stage_1: "Thickening"
 nw_nurture_stage_2: "Budding"
 nw_nurture_slow_growth: "Slow Growth"
 nw_nurture_slow_growth_desc: "15 Food a month. The tree grows as trees do."
 nw_nurture_forced_bloom_desc: "45 Food a month and twice the pace, at the cost of a quarter of the Ark's hull while it lasts."
 nw_nurture_deep_dormancy: "Deep Dormancy"
 nw_nurture_deep_dormancy_desc: "No growth, no drain, and the bark hardens: +20% hull while dormant."
 nw_docked_at_roothold: "Docked at a Roothold"
 nw_near_living_world: "Near a living world"
 nw_food_starved: "Starved of food"
 nw_nurture_complete_tt: "The Ark grows to its next stage."

 # ---- Technology ----
 tech_nw_seed_casting: "Seed Casting"
 tech_nw_seed_casting_desc: "A Bole or Elder Ark can drop a seed in any system with a Roothold. Nursed with Biomass and Food, it becomes a new Ark."
 tech_nw_lattice_sensing: "Lattice Sensing"
 tech_nw_lattice_sensing_desc: "Unlocks the Spore Nursery Roothold module. A Lumen Ark can survey systems adjacent to the Lattice without entering them."
 tech_nw_deep_taproot: "Deep Taproot"
 tech_nw_deep_taproot_desc: "The Seedwings learn to gather a Husk: the dead heart of a world the Taproot broke, or of the one we left. Each Husk can be gathered once, and what it held becomes new life."
 tech_nw_elder_growth: "Elder Growth"
 tech_nw_elder_growth_desc: "A Bole may be nurtured into an Elder."

 # ---- Harvest actions ----
 nw_harvest_rootfeeding: "Rootfeeding"
 nw_harvest_rootfeeding_desc: "The root cage opens and the Ark feeds on a dead world."
 nw_harvest_devouring_root: "Devouring Root"
 nw_harvest_devouring_root_desc: "The Taproot goes in to the core. What is left is a Shattered World and a Husk the Seedwings can gather."

 # ---- Symbioses ----
 contract_nw_seed_a_grove: "Seed a Grove"
 contract_nw_seed_a_grove_desc: "A settled empire asks the Uprooted to leave a sapling on a struggling world."
 contract_nw_reforest: "Reforest"
 contract_nw_reforest_desc: "A settled empire asks the Uprooted to clear a world's blockers the slow way."
 contract_nw_beg_a_sapling: "Beg a Sapling"
 contract_nw_beg_a_sapling_desc: "A Tree of Life empire offers a sapling to an Uprooted fleet whose every Ark has withered."

 # ---- System ----
 NAME_nw_rootscar_system: "Rootscar"
 NAME_nw_rootscar: "Rootscar"

 # ---- Events ----
 nw_uprooted.1.name: "The Uprooting"
 nw_uprooted.1.desc: "We remember the Grove as a body remembers a limb.\n\nOne world, one organism. The Heartwood at its centre was not a tree we lived beside; it was the trunk we grew from, and we were its roots, laid across a continent. We were content. We were slow.\n\nThen the Blight.\n\nThe Heartwood felt the end coming a century before it arrived. It spent that century growing inward: pressure vessels of lignin, bladders of sap, reactors of mycelium, a crown of sunleaf wide enough to drink starlight instead of sunlight. Then it drew us in, every drone, every spore, every memory, and pulled.\n\nThe world cracked. We did not."
 nw_uprooted.1.a: "The star was dying. The Grove could not follow it into the dark."
 nw_uprooted.1.b: "Something came. We do not speak of it. We left before it finished."
 nw_uprooted.1.c: "We ate our own world. We were hungry, and it was there. We have learned."
 nw_uprooted.2.name: "What Endured"
 nw_uprooted.2.desc: "An Ark is not a ship. It is the Grove, folded. But not every part of the Grove survived the folding, and the tree we are now bears the shape of what did."
 nw_uprooted.2.heartwood: "The orchards. We are the Heartwood Ark."
 nw_uprooted.2.heartwood.tt: "Our Ark is a §YHeartwood Ark§! (Civilian). §YFruiting§!: a share of everything it harvests is credited as Biomass."
 nw_uprooted.2.lumen: "The flowers that watched the sky. We are the Lumen Ark."
 nw_uprooted.2.lumen.tt: "Our Ark is a §YLumen Ark§! (Scientific). §YSpore Survey§!: through a §YSpore Nursery§!, it surveys systems along the Lattice without entering them."
 nw_uprooted.2.thornwood: "The thorns. We are the Thornwood Ark."
 nw_uprooted.2.thornwood.tt: "Our Ark is a §YThornwood Ark§! (Military). §YLiving Hull§!: hull regenerates out of combat, and the Heartwood withers only below 12.5% hull instead of 25%."
 nw_uprooted.10.name: "A Root Touches Stone"
 nw_uprooted.10.desc: "The first Roothold has taken. Mycelium wraps a nameless rock, white threads sinking into regolith that has never known anything alive. Somewhere far behind us the Grove is dust, and here, for the first time since, a root touches stone and holds."
 nw_uprooted.10.a: "We remember how this feels."
 nw_uprooted.20.name: "The Core Goes Dark"
 nw_uprooted.20.desc: "The veins dim first. Then the pods go cold, one by one, and the canopy begins to drop leaves into the dark where no wind will catch them. The Heartwood Core of [Root.GetName] has withered.\n\nThe hive is not dead. But it is sick, and it will stay sick until a sapling is carried across from an Ark whose heart still beats."
 nw_uprooted.20.a: "Bring a sapling."
 nw_uprooted.20.a.tt: "Use the §YTransplant Sapling§! decision on the withered Ark while an intact Ark is in the same system."
 nw_uprooted.21.name: "The Core Beats Again"
 nw_uprooted.21.desc: "Half a year of sap and patience. The sapling went in grey and came up green, and tonight the veins of [Root.GetName] pulse in time with the rest of the fleet. The hive remembers the Grove. The hive remembers that the Grove can be regrown."
 nw_uprooted.21.a: "We are a forest now, not a tree."
 nw_uprooted.30.name: "Memory of the Grove"
 nw_uprooted.30.desc: "The Rootscar hangs where we left it: a world broken open like a seed case, its crust a ring of debris, its core cooling.\n\nIn the wreckage, something. A single seed of the Heartwood, left dormant in the ruin on the day we left, against the day every Ark should wither at once. It could be taken aboard. Or it could be left here, in the one place that will always be ours."
 nw_uprooted.30.a: "Take it. We may need it."
 nw_uprooted.30.a.tt: "Gain an emergency sapling. If every Ark withers, a Transplant can be performed once without an intact Ark."
 nw_uprooted.30.b: "Leave it. Remember."
 nw_uprooted.40.name: "The Long Drift"
 nw_uprooted.40.desc: "Decades of starlight on the canopy. The drones that remember the Grove are few now, and the ones that replaced them know only the drift. The hive could spend what memory remains to grow, or hold it."
 nw_uprooted.40.a: "Spend it. 500 Unity for 500 Biomass."
 nw_uprooted.40.b: "Hold it. Keep drifting."
 nw_uprooted.50.name: "A Ring Closes"
 nw_uprooted.50.desc: "The trunk has thickened past the last mark. Branches that were buds are limbs. [Root.GetName] has grown into its next stage of life."
 nw_uprooted.50.a: "Good."
 nw_uprooted.100.name: "Taking Root"
 nw_uprooted.100.desc: "The Elder comes down slowly, roots first, the way it left. Rock gives. The trunk settles into the crust and keeps going, and the crown that drank starlight for generations spreads over a sky for the first time in living memory.\n\nThe drift is over. We are a world again, and at our heart stands a Tree of Life."
 nw_uprooted.100.a: "Home."
 nw_uprooted.100.a.tt: "The empire becomes a settled §YWilderness§! empire. The new world has a §YTree of Life§!."
